<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Yiga Oluganda Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --sunk:#efebe6; --line:#ddd5cc;
  --fg:#211a15; --muted:#6d6158;
  --accent:#8a3f1d; --accent-fg:#ffffff;
  --ok:#2f6b3a; --ok-soft:#e1efe1; --warn:#8a5a00; --warn-soft:#f7ead0; --danger:#a12a2a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#171310; --surface:#211b17; --sunk:#2a231e; --line:#3b322b;
  --fg:#f1e9e2; --muted:#a99a8e;
  --accent:#e08a5c; --accent-fg:#1c120c;
  --ok:#7fc68b; --ok-soft:#1f3322; --warn:#e2b55c; --warn-soft:#3a2e15; --danger:#ef7d7d;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:2px 0 0}
h1 em{font-style:normal;color:var(--accent)}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
.status{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media (max-width:520px){.c4,.c3{grid-column:span 6}.c2{grid-column:span 3}}
label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
label .req{color:var(--accent)}
input,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid transparent;border-radius:9px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.stepper{display:flex;align-items:stretch;background:var(--sunk);border-radius:9px;overflow:hidden}
.stepper button{width:44px;border:0;background:transparent;color:var(--fg);font-size:22px;cursor:pointer}
.stepper button:hover{background:var(--line)}
.stepper input{text-align:center;background:transparent;border-radius:0;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:15px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.total-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:14px}
.total{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.total small{font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted);display:block}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:10px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-size:17px;padding:13px 22px}
.btn.small{padding:7px 12px;font-size:14px;border-radius:8px}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:14px;color:var(--danger)}
.msg.ok{color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input[type=search]{flex:1 1 200px}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.who{min-width:0}
.who b{font-size:17px}
.who .addr,.who .contact,.who .note{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.who .note{font-style:italic}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt b{font-family:var(--display);font-size:19px}
.amt div{font-size:13px;color:var(--muted)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--fg);border:0;font-family:inherit}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
button.chip{cursor:pointer}
.spacer{flex:1}
.date{font-size:12.5px;color:var(--muted)}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;margin-bottom:4px}
.confirm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);padding:10px 12px;border-radius:10px;font-size:14px}
.price-set{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.price-set input{width:96px;padding:8px 10px}
.hidebar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.private{padding:22px 8px;text-align:center;color:var(--muted)}
.settings summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:18px}
.settings[open] summary{margin-bottom:14px}
.check{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--fg);font-weight:400}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.msg .btn{margin-left:8px}
dialog{border:0;padding:0;border-radius:16px;background:var(--surface);color:var(--fg);width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(20,14,10,.55)}
.dlg{display:flex;flex-direction:column;gap:14px;padding:18px;max-height:calc(100dvh - 32px);overflow:auto}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.receipt{background:var(--sunk);border-radius:10px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:0}
.send{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.send .btn{width:100%}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.hint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.seg button{transition:background .15s,transform .1s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Sales on the spot</div>
      <h1>Yiga <em>Oluganda</em></h1>
    </div>
    <div class="status" id="status">Saved on this device</div>
  </header>

  <section class="stats" aria-label="Totals">
    <div class="stat"><b id="sCopies">0</b><span>copies sold</span></div>
    <div class="stat"><b id="sMoney">0 kr</b><span>taken in</span></div>
    <div class="stat"><b id="sBuyers">0</b><span>buyers</span></div>
    <div class="stat"><b id="sDeliver">0</b><span>still to deliver</span></div>
  </section>

  <form class="panel" id="form" autocomplete="off" novalidate>
    <div class="panel-head">
      <h2 id="formTitle">New sale</h2>
      <div class="price-set"><label for="defaultPrice">Standard price</label><input id="defaultPrice" type="number" inputmode="decimal" min="0" step="1" placeholder="kr"> kr</div>
    </div>
    <div class="grid">
      <div class="f c6"><label for="name">Full name <span class="req">*</span></label><input id="name" required placeholder="e.g. Nakato Namuli"></div>
      <div class="f c3"><label for="phone">Phone</label><input id="phone" type="tel" inputmode="tel" placeholder="07x xxx xx xx"></div>
      <div class="f c3"><label for="email">Email</label><input id="email" type="email" inputmode="email"></div>
      <div class="f c6"><label for="street">Street address</label><input id="street" placeholder="Street and number, c/o, apartment"></div>
      <div class="f c2"><label for="postcode">Postcode</label><input id="postcode" inputmode="numeric" placeholder="123 45"></div>
      <div class="f c4"><label for="city">City</label><input id="city"></div>
      <div class="f c2"><span class="lbl" id="copiesLbl">Copies</span>
        <div class="stepper" role="group" aria-labelledby="copiesLbl">
          <button type="button" id="minus" aria-label="One fewer">−</button>
          <input id="copies" type="number" inputmode="numeric" min="1" value="1" aria-label="Number of copies">
          <button type="button" id="plus" aria-label="One more">+</button>
        </div>
      </div>
      <div class="f c2"><label for="price">Price per copy (kr)</label><input id="price" type="number" inputmode="decimal" min="0" step="1"></div>
      <div class="f c2"><label for="date">Date</label><input id="date" type="date"></div>
      <div class="f c6"><span class="lbl">Paid with</span>
        <div class="seg" id="paySeg">
          <button type="button" data-v="Swish" aria-pressed="true">Swish</button>
          <button type="button" data-v="Cash" aria-pressed="false">Cash</button>
          <button type="button" data-v="Card" aria-pressed="false">Card</button>
          <button type="button" data-v="Not paid yet" aria-pressed="false">Not paid yet</button>
        </div>
      </div>
      <div class="f c6"><span class="lbl">Book</span>
        <div class="seg" id="delSeg">
          <button type="button" data-v="handed" aria-pressed="true">Handed over now</button>
          <button type="button" data-v="deliver" aria-pressed="false">Send / deliver later</button>
        </div>
      </div>
      <div class="f c6"><label for="note">Note</label><textarea id="note" rows="2" placeholder="Signed copy, gift, who referred them…"></textarea></div>
    </div>
    <div class="total-row">
      <div class="total" id="total">0 kr<small id="totalSub">1 copy</small></div>
      <div class="btns">
        <button type="button" class="btn" id="cancelEdit" hidden>Cancel</button>
        <button type="submit" class="btn primary" id="saveBtn">Save sale</button>
      </div>
    </div>
    <div class="msg" id="formMsg" role="status"></div>
  </form>

  <section class="panel" aria-labelledby="listTitle">
    <div class="hidebar">
      <h2 id="listTitle">Buyers</h2>
      <button type="button" class="btn small" id="toggleList">Hide list</button>
    </div>
    <div id="listArea">
      <div class="tools">
        <input id="search" type="search" placeholder="Search name, city, phone…" aria-label="Search buyers">
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="private" id="privateNote" hidden>List hidden. Totals above still update.</div>
    <div class="tools">
      <button type="button" class="btn small" id="exportBtn">Export to Excel (CSV)</button>
      <button type="button" class="btn small" id="importBtn">Import CSV</button>
      <input type="file" id="importFile" accept=".csv,text/csv" hidden>
    </div>
  </section>

  <details class="panel settings" id="settings">
    <summary>Receipt details</summary>
    <div class="grid">
      <div class="f c6"><label for="sellerName">Seller name on receipt</label><input id="sellerName" placeholder="Your name or company"></div>
      <div class="f c3"><label for="sellerContact">Your phone / Swish number</label><input id="sellerContact" inputmode="tel"></div>
      <div class="f c3"><label for="sellerOrg">Org. number (optional)</label><input id="sellerOrg" placeholder="e.g. 559xxx-xxxx"></div>
      <div class="f c6"><label for="sellerThanks">Message at the bottom</label><input id="sellerThanks"></div>
      <div class="f c6"><label class="check"><input type="checkbox" id="sellerVat"> Show VAT (moms 6 %) on receipts</label></div>
    </div>
    <div class="hint">These details print on every receipt. They save on this device.</div>
  </details>
</div>

<dialog id="rcpt">
  <div class="dlg">
    <div class="dlg-head"><h2 id="rcptTitle">Receipt</h2><button type="button" class="btn small" id="rcptClose">Close</button></div>
    <pre class="receipt" id="rcptText"></pre>
    <div class="send">
      <button type="button" class="btn wa" id="rcptWa">Send on WhatsApp</button>
      <button type="button" class="btn primary" id="rcptMail" style="font-size:16px;padding:12px 18px">Send by email</button>
      <button type="button" class="btn" id="rcptImg">Share as image</button>
      <button type="button" class="btn" id="rcptCopy">Copy text</button>
    </div>
    <div class="hint" id="rcptHint"></div>
  </div>
</dialog>

<script>
(function(){
  const KEY='yiga-oluganda-sales-v1';
  const $ = id => document.getElementById(id);
  const kr = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('sv-SE') + ' kr';
  const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

  // ---- storage (this browser only) ----
  const SELLER_DEFAULT={name:'Yiga Oluganda', contact:'', org:'', thanks:'Webale nnyo! Thank you for buying Yiga Oluganda.', vat:false};
  let state={price:'', sales:[], hideList:false, nextNo:1, seller:{...SELLER_DEFAULT}}, storageOk=true;
  try{ const raw=localStorage.getItem(KEY); if(raw){ const p=JSON.parse(raw); state={...state,...p, seller:{...SELLER_DEFAULT,...(p.seller||{})}}; } }catch(e){ storageOk=false; }
  if(!state.nextNo) state.nextNo=1;
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch(e){ storageOk=false; $('status').textContent='Not saving: this browser blocks storage (private mode?)'; return false; }
  }
  if(!storageOk) $('status').textContent='Not saving: this browser blocks storage (private mode?)';
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

  let editingId=null, confirmId=null, pay='Swish', del='handed';

  function setSeg(segId, v){ $(segId).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.v===v))); }
  $('paySeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; pay=b.dataset.v; setSeg('paySeg',pay);});
  $('delSeg').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b)return; del=b.dataset.v; setSeg('delSeg',del);});

  function copies(){ return Math.max(1, parseInt($('copies').value,10)||1); }
  function updateTotal(){
    const c=copies(), p=parseFloat($('price').value)||0;
    $('total').firstChild.nodeValue = kr(c*p);
    $('totalSub').textContent = c + (c===1?' copy':' copies') + (p? ' × '+kr(p):' · set a price');
  }
  $('minus').onclick=()=>{ $('copies').value=Math.max(1,copies()-1); updateTotal(); };
  $('plus').onclick=()=>{ $('copies').value=copies()+1; updateTotal(); };
  ['copies','price'].forEach(id=>$(id).addEventListener('input',updateTotal));

  function resetForm(){
    editingId=null;
    ['name','phone','email','street','postcode','city','note'].forEach(id=>$(id).value='');
    $('copies').value=1; $('price').value=state.price; $('date').value=today();
    pay='Swish'; del='handed'; setSeg('paySeg',pay); setSeg('delSeg',del);
    $('formTitle').textContent='New sale'; $('saveBtn').textContent='Save sale'; $('cancelEdit').hidden=true;
    updateTotal();
  }
  $('cancelEdit').onclick=()=>{ resetForm(); $('formMsg').textContent=''; };

  $('defaultPrice').value=state.price;
  $('defaultPrice').addEventListener('input',()=>{
    state.price=$('defaultPrice').value; persist();
    if(!editingId){ $('price').value=state.price; updateTotal(); }
  });

  $('form').addEventListener('submit', e=>{
    e.preventDefault();
    const msg=$('formMsg'); msg.className='msg';
    const name=$('name').value.trim();
    if(!name){ msg.textContent='Write the buyer’s name first.'; $('name').focus(); return; }
    const c=copies(), p=parseFloat($('price').value)||0;
    const rec={ name, phone:$('phone').value.trim(), email:$('email').value.trim(),
      street:$('street').value.trim(), postcode:$('postcode').value.trim(), city:$('city').value.trim(),
      copies:c, price:p, total:Math.round(c*p*100)/100, payment:pay, delivered: del==='handed',
      note:$('note').value.trim(), date:$('date').value||today() };
    let savedId, text;
    if(editingId){
      const i=state.sales.findIndex(s=>s.id===editingId);
      if(i>-1) state.sales[i]={...state.sales[i],...rec};
      savedId=editingId; text='Changes saved for '+name+'.';
    } else {
      savedId=newId();
      state.sales.unshift({id:savedId, createdAt:Date.now(), receiptNo:state.nextNo++, ...rec});
      text='Saved: '+name+', '+c+(c===1?' copy':' copies')+'.';
    }
    if(persist()){
      msg.className='msg ok';
      msg.innerHTML=esc(text)+'<button type="button" class="btn small" id="msgReceipt">Send receipt</button>';
      $('msgReceipt').onclick=()=>openReceipt(savedId);
    } else msg.textContent='Couldn’t save. This browser blocks storage.';
    resetForm(); render(); $('name').focus();
  });

  function addressLine(s){ return [s.street, [s.postcode,s.city].filter(Boolean).join(' ')].filter(Boolean).join(', '); }

  function render(){
    const sales=state.sales;
    const tot=sales.reduce((a,s)=>({c:a.c+(s.copies||0),m:a.m+(s.payment==='Not paid yet'?0:(s.total||0)),d:a.d+(s.delivered?0:1)}),{c:0,m:0,d:0});
    $('sCopies').textContent=tot.c; $('sMoney').textContent=kr(tot.m); $('sBuyers').textContent=sales.length; $('sDeliver').textContent=tot.d;

    $('listArea').hidden=!!state.hideList; $('privateNote').hidden=!state.hideList;
    $('toggleList').textContent=state.hideList?'Show list':'Hide list';

    const q=$('search').value.trim().toLowerCase();
    const shown=sales.filter(s=>!q||[s.name,s.phone,s.email,s.street,s.postcode,s.city,s.note].join(' ').toLowerCase().includes(q));
    const list=$('list');
    if(!sales.length){ list.innerHTML='<div class="empty"><b>No sales yet</b>Fill in the form above and press Save sale. Every buyer shows up here.</div>'; return; }
    if(!shown.length){ list.innerHTML='<div class="empty"><b>No match</b>Nobody matches “'+esc(q)+'”.</div>'; return; }
    list.innerHTML=shown.map(s=>{
      const addr=addressLine(s), contact=[s.phone,s.email].filter(Boolean).join(' · ');
      const d = s.date ? new Date(s.date+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
      return `<div class="row" data-id="${esc(s.id)}">
        <div class="who"><b>${esc(s.name)}</b>
          ${addr?`<div class="addr">${esc(addr)}</div>`:''}
          ${contact?`<div class="contact">${esc(contact)}</div>`:''}
          ${s.note?`<div class="note">${esc(s.note)}</div>`:''}
        </div>
        <div class="amt"><b>${kr(s.total)}</b><div>${s.copies} × ${kr(s.price)}</div></div>
        <div class="meta">
          <span class="chip ${s.payment==='Not paid yet'?'warn':''}">${esc(s.payment)}</span>
          <button type="button" class="chip ${s.delivered?'ok':'warn'}" data-act="toggle" title="Tap to change">${s.delivered?'Book handed over':'To deliver'}</button>
          <span class="date">${esc(d)}</span><span class="spacer"></span>
          <button type="button" class="btn small" data-act="receipt">Receipt</button>
          <button type="button" class="btn small" data-act="edit">Edit</button>
          <button type="button" class="btn small" data-act="ask">Remove</button>
        </div>
        ${confirmId===s.id?`<div class="confirm">Remove ${esc(s.name)} from the list?<span class="spacer"></span><button type="button" class="btn small danger" data-act="del">Remove</button><button type="button" class="btn small" data-act="keep">Keep</button></div>`:''}
      </div>`;
    }).join('');
  }
  $('search').addEventListener('input',render);
  $('toggleList').onclick=()=>{ state.hideList=!state.hideList; persist(); render(); };

  $('list').addEventListener('click', e=>{
    const b=e.target.closest('[data-act]'); if(!b)return;
    const id=b.closest('.row').dataset.id, s=state.sales.find(x=>x.id===id); if(!s)return;
    const act=b.dataset.act;
    if(act==='ask'){ confirmId=id; render(); return; }
    if(act==='keep'){ confirmId=null; render(); return; }
    if(act==='del'){ confirmId=null; state.sales=state.sales.filter(x=>x.id!==id); persist(); render(); return; }
    if(act==='toggle'){ s.delivered=!s.delivered; persist(); render(); return; }
    if(act==='receipt'){ openReceipt(id); return; }
    if(act==='edit'){
      editingId=id;
      ['name','phone','email','street','postcode','city','note'].forEach(k=>$(k).value=s[k]||'');
      $('copies').value=s.copies||1; $('price').value=s.price??''; $('date').value=s.date||today();
      pay=s.payment||'Swish'; del=s.delivered?'handed':'deliver'; setSeg('paySeg',pay); setSeg('delSeg',del);
      $('formTitle').textContent='Edit sale'; $('saveBtn').textContent='Save changes'; $('cancelEdit').hidden=false;
      $('formMsg').textContent=''; updateTotal();
      $('form').scrollIntoView({behavior:'smooth',block:'start'}); $('name').focus({preventScroll:true});
    }
  });

  // ---- CSV export / import ----
  const HEAD=['Receipt no','Date','Name','Phone','Email','Street','Postcode','City','Copies','Price per copy','Total','Paid with','Book handed over','Note'];
  $('exportBtn').onclick=()=>{
    const cell=v=>{ v=String(v??''); return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
    const rows=state.sales.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))
      .map(s=>[s.receiptNo?'YO-'+String(s.receiptNo).padStart(4,'0'):'',s.date,s.name,s.phone,s.email,s.street,s.postcode,s.city,s.copies,s.price,s.total,s.payment,s.delivered?'Yes':'No',s.note]);
    const csv='﻿'+[HEAD,...rows].map(r=>r.map(cell).join(';')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a'); a.href=url; a.download='yiga-oluganda-sales-'+today()+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
  };

  function parseCSV(text){
    text=text.replace(/^﻿/,'');
    const sep = (text.split(/\r?\n/)[0].match(/;/g)||[]).length >= (text.split(/\r?\n/)[0].match(/,/g)||[]).length ? ';' : ',';
    const rows=[]; let row=[], cell='', q=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
      else if(ch==='"') q=true;
      else if(ch===sep){ row.push(cell); cell=''; }
      else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
      else cell+=ch;
    }
    if(cell!==''||row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.some(c=>c.trim()!==''));
  }
  $('importBtn').onclick=()=>$('importFile').click();
  $('importFile').onchange=async e=>{
    const f=e.target.files[0]; e.target.value=''; if(!f) return;
    const rows=parseCSV(await f.text());
    const h=rows.shift()||[]; const ix=n=>h.findIndex(x=>x.trim().toLowerCase()===n.toLowerCase());
    if(ix('Name')<0){ $('status').textContent='That file doesn’t look like an export from this page.'; return; }
    const num=v=>parseFloat(String(v||'').replace(/\s/g,'').replace(',','.'))||0;
    const seen=new Set(state.sales.map(s=>[s.date,s.name,s.copies].join('|')));
    let added=0;
    rows.forEach((r,k)=>{
      const g=n=>{const i=ix(n); return i<0?'':(r[i]||'').trim();};
      const name=g('Name'); if(!name) return;
      const rec={ id:newId(), createdAt:Date.now()-rows.length+k, date:g('Date')||today(), name, phone:g('Phone'), email:g('Email'),
        street:g('Street'), postcode:g('Postcode'), city:g('City'), copies:Math.max(1,parseInt(g('Copies'),10)||1),
        price:num(g('Price per copy')), total:num(g('Total')), payment:g('Paid with')||'Swish',
        delivered:!/^no$/i.test(g('Book handed over')), note:g('Note') };
      if(!rec.total) rec.total=rec.copies*rec.price;
      const rn=parseInt(g('Receipt no').replace(/\D/g,''),10);
      if(rn){ rec.receiptNo=rn; state.nextNo=Math.max(state.nextNo,rn+1); }
      const k2=[rec.date,rec.name,rec.copies].join('|'); if(seen.has(k2)) return; seen.add(k2);
      state.sales.push(rec); added++;
    });
    state.sales.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    persist(); render();
    $('status').textContent= added ? 'Imported '+added+(added===1?' sale':' sales')+'.' : 'Nothing new to import.';
  };

  // ---- receipt details (settings) ----
  const SET={sellerName:'name', sellerContact:'contact', sellerOrg:'org', sellerThanks:'thanks'};
  Object.entries(SET).forEach(([id,k])=>{ $(id).value=state.seller[k]||''; $(id).addEventListener('input',()=>{ state.seller[k]=$(id).value; persist(); }); });
  $('sellerVat').checked=!!state.seller.vat;
  $('sellerVat').addEventListener('change',()=>{ state.seller.vat=$('sellerVat').checked; persist(); });

  // ---- receipts ----
  const money = n => (Math.round((Number(n)||0)*100)/100).toLocaleString('sv-SE',{minimumFractionDigits:0,maximumFractionDigits:2})+' kr';
  function ensureNo(s){ if(!s.receiptNo){ s.receiptNo=state.nextNo++; persist(); } return 'YO-'+String(s.receiptNo).padStart(4,'0'); }
  function receiptData(s){
    const sl=state.seller, no=ensureNo(s), unpaid=s.payment==='Not paid yet';
    const d=s.date?new Date(s.date+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}):'';
    const head=[sl.name||'Yiga Oluganda', sl.org?'Org. no. '+sl.org:'', sl.contact?'Tel / Swish: '+sl.contact:''].filter(Boolean);
    const cust=[s.name, s.street, [s.postcode,s.city].filter(Boolean).join(' ')].filter(Boolean);
    const vat = sl.vat ? Math.round(s.total*6/106*100)/100 : null;
    return {no,d,head,cust,unpaid,vat,item:'Yiga Oluganda (book)',qty:s.copies,price:s.price,total:s.total,payment:s.payment,thanks:sl.thanks};
  }
  function receiptText(s){
    const r=receiptData(s), L='--------------------------------';
    const out=['RECEIPT '+r.no, ...r.head, L,
      'Date: '+r.d, 'Customer: '+r.cust.join(', '), L,
      r.item, '  '+r.qty+' × '+money(r.price)+' = '+money(r.total), L,
      'TOTAL: '+money(r.total),
      r.unpaid ? 'Status: NOT PAID YET – amount due '+money(r.total) : 'Paid with: '+r.payment];
    if(r.vat!=null) out.push('VAT (moms 6 %) included: '+money(r.vat));
    if(r.thanks) out.push('', r.thanks);
    return out.join('\n');
  }
  function waNumber(p){
    let n=String(p||'').trim(); const plus=n.startsWith('+'); n=n.replace(/\D/g,'');
    if(!n) return '';
    if(plus) return n;
    if(n.startsWith('00')) return n.slice(2);
    if(n.startsWith('0')) return '46'+n.slice(1);   // Swedish number like 070…
    return n;
  }
  function drawReceipt(s){
    const r=receiptData(s), W=720, pad=48, lines=[];
    const add=(t,o={})=>lines.push({t,...o});
    add('RECEIPT',{size:16,bold:true,color:'#8a3f1d',gap:6}); add(r.no,{size:30,bold:true,gap:18});
    r.head.forEach((h,i)=>add(h,{size:i?20:24,bold:!i,gap:4}));
    add('',{rule:true}); add('Date',{size:18,muted:true,right:r.d}); add('Customer',{size:18,muted:true,right:r.cust[0]});
    r.cust.slice(1).forEach(c=>add('',{size:18,right:c}));
    add('',{rule:true}); add(r.item,{size:22,bold:true,gap:4}); add(r.qty+' × '+money(r.price),{size:20,muted:true,right:money(r.total)});
    add('',{rule:true}); add('TOTAL',{size:30,bold:true,right:money(r.total)});
    add(r.unpaid?'Not paid yet':'Paid with',{size:20,muted:!r.unpaid,color:r.unpaid?'#8a5a00':null,right:r.unpaid?'Amount due':r.payment});
    if(r.vat!=null) add('VAT (moms 6 %) included',{size:18,muted:true,right:money(r.vat)});
    if(r.thanks){ add('',{rule:true}); add(r.thanks,{size:20,wrap:true}); }
    const c=document.createElement('canvas'), x=c.getContext('2d');
    const font=(o)=>(o.bold?'700 ':'400 ')+o.size+'px "Atkinson Hyperlegible", system-ui, sans-serif';
    // measure height (wrap long text)
    const items=[]; let h=pad;
    lines.forEach(o=>{
      if(o.rule){ items.push({...o,y:h+14}); h+=30; return; }
      x.font=font(o); let rows=[o.t];
      if(o.wrap){ rows=[]; let cur=''; o.t.split(' ').forEach(w=>{ const t=cur?cur+' '+w:w; if(x.measureText(t).width>W-pad*2&&cur){rows.push(cur);cur=w;} else cur=t; }); rows.push(cur); }
      rows.forEach((t,i)=>{ items.push({...o,t,right:i?null:o.right,y:h+o.size}); h+=o.size*1.45; });
      h+=(o.gap||8);
    });
    h+=pad; const dpr=2; c.width=W*dpr; c.height=Math.ceil(h)*dpr; x.scale(dpr,dpr);
    x.fillStyle='#ffffff'; x.fillRect(0,0,W,h); x.fillStyle='#8a3f1d'; x.fillRect(0,0,W,8);
    items.forEach(o=>{
      if(o.rule){ x.strokeStyle='#ddd5cc'; x.setLineDash([6,6]); x.beginPath(); x.moveTo(pad,o.y); x.lineTo(W-pad,o.y); x.stroke(); x.setLineDash([]); return; }
      x.font=font(o); x.fillStyle=o.color||(o.muted?'#6d6158':'#211a15'); x.textAlign='left'; x.fillText(o.t,pad,o.y);
      if(o.right){ x.font=font({...o,bold:o.bold||!o.muted}); x.fillStyle=o.color||'#211a15'; x.textAlign='right'; x.fillText(o.right,W-pad,o.y); }
    });
    return c;
  }

  let rcptSale=null;
  function openReceipt(id){
    const s=state.sales.find(x=>x.id===id); if(!s) return;
    rcptSale=s; const text=receiptText(s);
    $('rcptTitle').textContent='Receipt '+ensureNo(s);
    $('rcptText').textContent=text;
    $('rcptWa').textContent = s.phone ? 'Send on WhatsApp' : 'WhatsApp (pick contact)';
    $('rcptMail').disabled = !s.email;
    $('rcptHint').textContent = !s.email && !s.phone ? 'No phone or email saved for this buyer. Add one with Edit, or share the image.' :
      !s.email ? 'No email saved for this buyer. Add it with Edit to send by email.' : '';
    try{ $('rcpt').showModal(); }catch(e){ $('rcpt').setAttribute('open',''); }
  }
  $('rcptClose').onclick=()=>$('rcpt').close();
  $('rcpt').addEventListener('click',e=>{ if(e.target===$('rcpt')) $('rcpt').close(); });
  $('rcptWa').onclick=()=>{
    const n=waNumber(rcptSale.phone), t=encodeURIComponent(receiptText(rcptSale));
    window.open(n?'https://wa.me/'+n+'?text='+t:'https://wa.me/?text='+t,'_blank','noopener');
  };
  $('rcptMail').onclick=()=>{
    const r=receiptData(rcptSale);
    location.href='mailto:'+encodeURIComponent(rcptSale.email)+'?subject='+encodeURIComponent('Receipt '+r.no+' – Yiga Oluganda')+'&body='+encodeURIComponent(receiptText(rcptSale));
  };
  $('rcptCopy').onclick=async()=>{
    try{ await navigator.clipboard.writeText(receiptText(rcptSale)); $('rcptHint').textContent='Copied. Paste it into any chat.'; }
    catch(e){ const r=document.createRange(); r.selectNodeContents($('rcptText')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $('rcptHint').textContent='Text selected. Copy it with your phone’s Copy button.'; }
  };
  $('rcptImg').onclick=()=>{
    const no=ensureNo(rcptSale), c=drawReceipt(rcptSale);
    c.toBlob(async blob=>{
      const file=new File([blob],'receipt-'+no+'.png',{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file], title:'Receipt '+no}); return; }catch(e){ if(e.name==='AbortError') return; }
      }
      const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=file.name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
      $('rcptHint').textContent='Image saved. Attach it in WhatsApp or email.';
    },'image/png');
  };

  resetForm(); render();
})();
</script>
</body>
</html>
